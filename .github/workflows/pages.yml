name: Asset viewer

# Publishes examples/asset-viewer to GitHub Pages whenever main changes.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - examples/asset-viewer/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/asset-viewer/package-lock.json
      - run: npm ci
        working-directory: examples/asset-viewer
      - run: npm run build
        working-directory: examples/asset-viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/asset-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
