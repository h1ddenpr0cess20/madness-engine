name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo.
permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor in `engines`.
        node: ['22.12', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The starter game: a new game built on nothing but the engine still installs and bundles.
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  # Keep the repository's interactive asset viewer buildable on pull requests.
  asset-viewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/asset-viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/asset-viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for model preview
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render turkey in the asset viewer
        run: |
          mkdir -p artifacts
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/asset-viewer.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
            });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            const response = await page.goto(
              'http://127.0.0.1:4173/#characters%2Fturkey.js',
              { waitUntil: 'commit', timeout: 60000 },
            );
            if (!response?.ok()) throw new Error(`Asset viewer returned HTTP ${response?.status()}`);
            await page.waitForFunction(
              () => document.querySelector('#title b')?.textContent?.toLowerCase().includes('turkey')
                && document.querySelector('#busy')?.style.display === 'none',
              null,
              { timeout: 120000 },
            );
            await page.waitForTimeout(1500);
            await page.screenshot({ path: 'artifacts/turkey.png', fullPage: true });
            console.log('Rendered turkey in the asset viewer:', await page.locator('#title b').textContent());

            // The two wizard-staff entries are real catalogue items, not just exported factories.
            // Render both in Chromium and exercise an asynchronous planetary topper selection.
            const waitForItem = async (id, title) => {
              const result = await page.goto(`http://127.0.0.1:4173/#${encodeURIComponent(id)}`, {
                waitUntil: 'commit',
                timeout: 60000,
              });
              if (!result?.ok()) throw new Error(`Asset viewer returned HTTP ${result?.status()} for ${id}`);
              await page.waitForFunction(
                (expected) => document.querySelector('#title b')?.textContent === expected
                  && document.querySelector('#busy')?.style.display === 'none',
                title,
                { timeout: 120000 },
              );
              if (document.querySelector('#err')?.textContent) throw new Error(document.querySelector('#err').textContent);
            };
            const readOptions = () => [...document.querySelectorAll('.line.opt')].map((row) => ({
              label: row.querySelector('label')?.textContent?.trim(),
              value: row.querySelector('select')?.value,
              options: [...(row.querySelector('select')?.options ?? [])].map((option) => option.value),
            }));

            await waitForItem('weapons/wizard-staff', 'Wizard Staff');
            const woodOptions = readOptions();
            const woodTopper = woodOptions.find((option) => option.label === 'Topper');
            if (!woodTopper || !['orb', 'egg', 'marble', 'globe', 'moon', 'mars', 'jupiter', 'none'].every((v) => woodTopper.options.includes(v))) {
              throw new Error('Wooden wizard staff is missing one or more topper choices');
            }
            await page.screenshot({ path: 'artifacts/wizard-staff-wood.png', fullPage: true });

            await waitForItem('weapons/wizard-staff-metal', 'Wizard Staff (Metal)');
            const metalOptions = readOptions();
            const metalTopper = metalOptions.find((option) => option.label === 'Topper');
            const metalFinish = metalOptions.find((option) => option.label === 'Structure metal');
            if (!metalTopper || !['orb', 'egg', 'marble', 'globe', 'moon', 'mars', 'jupiter', 'none'].every((v) => metalTopper.options.includes(v))) {
              throw new Error('Metal wizard staff is missing one or more topper choices');
            }
            if (!metalFinish || metalFinish.value !== 'gold') {
              throw new Error(`Metal wizard staff should default to gold, received ${metalFinish?.value ?? 'no metal control'}`);
            }
            const topperSelect = [...document.querySelectorAll('.line.opt')].find((row) => row.querySelector('label')?.textContent?.trim() === 'Topper')?.querySelector('select');
            topperSelect.value = 'jupiter';
            topperSelect.dispatchEvent(new Event('change', { bubbles: true }));
            await page.waitForFunction(
              () => document.querySelector('#busy')?.style.display === 'none'
                && !document.querySelector('#err')?.textContent,
              null,
              { timeout: 120000 },
            );
            await page.waitForTimeout(1200);
            const jupiterSurface = await page.evaluate(() => {
              const root = window.assetViewer?.view?.built?.object;
              const planet = root?.getObjectByName('jupiter glass staff topper');
              return {
                etchedShells: ['etch-near', 'etch-far'].filter((name) => planet?.getObjectByName(name)?.visible).length,
                cloudField: Boolean(planet?.getObjectByName('field')?.visible),
              };
            });
            if (jupiterSurface.etchedShells !== 2 || !jupiterSurface.cloudField) {
              throw new Error(`Jupiter should render both etched glass shells and its cloud field: ${JSON.stringify(jupiterSurface)}`);
            }
            await page.screenshot({ path: 'artifacts/wizard-staff-metal-jupiter.png', fullPage: true });

            if (errors.length) throw new Error(errors.join('\\n'));
            console.log('Rendered both wizard staff variants and the gold Jupiter topper in the asset viewer.');
          } finally {
            await browser.close();
          }
          NODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: asset-viewer-smoke
          path: |
            examples/asset-viewer/artifacts/turkey.png
            examples/asset-viewer/artifacts/wizard-staff-wood.png
            examples/asset-viewer/artifacts/wizard-staff-metal-jupiter.png
          if-no-files-found: warn
