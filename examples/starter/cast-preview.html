<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madness Engine · Cast design preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101522; color: #f4f1eb; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #game { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      #game canvas { display: block; width: 100%; height: 100%; }
      .heading { position: absolute; z-index: 2; left: 0; right: 0; top: 30px; text-align: center; text-transform: uppercase; letter-spacing: .22em; font-size: 13px; font-weight: 700; color: #c9d5eb; }
      .heading strong { display: block; margin-top: 10px; font-size: clamp(20px, 2.4vw, 34px); letter-spacing: .06em; color: #fffaf2; }
      .footer { position: absolute; z-index: 2; left: 4%; right: 4%; bottom: 34px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; }
      .name { border-top: 1px solid #75839b; padding-top: 12px; text-align: center; font-size: clamp(10px, 1vw, 14px); font-weight: 650; color: #f4f1eb; letter-spacing: .05em; text-transform: uppercase; }
      .subhead { position: absolute; z-index: 2; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 10px; letter-spacing: .14em; color: #8f9ab0; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="game">
      <div class="heading">Madness Engine / Sculpted cast<strong>Character design review</strong></div>
      <div class="footer" aria-label="Characters in this preview">
        <div class="name">Agent</div><div class="name">Punk</div><div class="name">Croc</div><div class="name">Gator</div>
        <div class="name">Kangaroo</div><div class="name">Rat</div><div class="name">Crow</div><div class="name">Zombie</div>
      </div>
      <div class="subhead">Rendered from the pull request branch · Shared sculpt helpers and historical variants</div>
    </div>
    <script type="module" src="/cast-preview.js"></script>
  </body>
</html>
