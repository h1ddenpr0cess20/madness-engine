<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; color: #f4f1ea; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
      #game { position: fixed; inset: 0; touch-action: none; }
      #hud { position: fixed; left: 16px; top: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #hud b { font-size: 22px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"><b id="score">0</b> / <span id="total">0</span> gold · arrows, WASD or hold to roll · Q/E turn · M mute</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
